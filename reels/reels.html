<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url(../fonts/schibsted-grotesk-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Schibsted Grotesk";src:url(../fonts/schibsted-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Bodoni Moda";src:url(../fonts/bodoni-moda-latin-500-italic.woff2) format("woff2");font-weight:500;font-style:italic}
@font-face{font-family:"Martian Mono";src:url(../fonts/martian-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Martian Mono";src:url(../fonts/martian-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="v" width="1080" height="1920"></canvas>
<script src="../dist/reel.js"></script>
<script src="../dist/hook.js"></script>
<script>
// 9:16 compositor: the hook, then the reel letterboxed (black bars) in a 1080x1920 frame.
window.ready = (async () => {
  await Promise.all(['800 100px "Schibsted Grotesk"', '700 100px "Schibsted Grotesk"', 'italic 500 100px "Bodoni Moda"',
    '400 20px "Martian Mono"', '500 20px "Martian Mono"'].map((f) => document.fonts.load(f)));
  const V = document.getElementById('v'), ctx = V.getContext('2d', { alpha: false });
  const RC = document.createElement('canvas');
  REEL.OPTS.grain = 0;            // no film grain: it only turns into compression noise on Instagram
  REEL.init(RC, 1);
  const { BAND_Y, BAND_H, VW, VH, DUR } = HOOK;
  const band = (c, src) => { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.drawImage(src, 0, BAND_Y, VW, BAND_H); };
  REEL.render(0);
  const R0 = document.createElement('canvas'); R0.width = VW; R0.height = VH;
  band(R0.getContext('2d'), RC);
  HOOK.init(ctx);
  window.frame = (T) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    if (T < DUR) {
      HOOK.base(ctx, T);
      const x = prog01(T, 3.72, 3.98);           // the band becomes the reel's first frame before the cut
      if (x > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, BAND_Y, VW, BAND_H); ctx.clip(); ctx.globalAlpha = x * x * (3 - 2 * x); ctx.drawImage(R0, 0, 0); ctx.restore(); }
      HOOK.top(ctx, T);
    } else {
      REEL.render(T - DUR);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
      band(ctx, RC);
      HOOK.after(ctx, T);
    }
  };
  function prog01(t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); }
  return true;
})();
</script></body></html>
