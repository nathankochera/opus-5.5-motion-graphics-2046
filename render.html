<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url(fonts/schibsted-grotesk-latin-800-normal.woff2) format("woff2");font-weight:800;font-style:normal}
@font-face{font-family:"Schibsted Grotesk";src:url(fonts/schibsted-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-style:normal}
@font-face{font-family:"Bodoni Moda";src:url(fonts/bodoni-moda-latin-500-italic.woff2) format("woff2");font-weight:500;font-style:italic}
@font-face{font-family:"Martian Mono";src:url(fonts/martian-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"Martian Mono";src:url(fonts/martian-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-style:normal}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script src="dist/reel.js"></script>
<script>
window.ready = (async () => {
  await Promise.all(['800 100px "Schibsted Grotesk"','700 100px "Schibsted Grotesk"','italic 500 100px "Bodoni Moda"','400 20px "Martian Mono"','500 20px "Martian Mono"'].map(f => document.fonts.load(f)));
  if (location.hash.includes("nograin")) REEL.OPTS.grain = 0; else if (location.hash.includes("grain=")) REEL.OPTS.grain = parseFloat(location.hash.split("grain=")[1]);
  if (location.hash.includes("static")) REEL.OPTS.grainRate = 0;
  REEL.init(document.getElementById("c"), 1);
  return true;
})();
</script></body></html>
